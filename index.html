<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MilihFoto</title>
    <!-- Anti-Screenshot & Security Meta Tags -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <!-- Proteksi Anti-Clickjacking (Frame Busting) -->
    <script>
        if (window.top !== window.self) {
            window.top.location = window.self.location;
        }

        (() => {
            const removeWeddingEmoji = () => {
                const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
                const nodes = [];

                while (walker.nextNode()) {
                    const node = walker.currentNode;
                    if (node.textContent && node.textContent.includes('💒')) {
                        nodes.push(node);
                    }
                }

                nodes.forEach(node => {
                    node.textContent = node.textContent.replace(/💒/g, '');
                });
            };

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', removeWeddingEmoji);
            } else {
                removeWeddingEmoji();
            }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', 'Noto Sans Symbols 2', 'Twemoji Mozilla', sans-serif;
        }

        .emoji-safe,
        .emoji-safe * {
            font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', 'Noto Sans Symbols 2', 'Twemoji Mozilla', sans-serif;
        }

        .selected-ring {
            border: 4px solid #3b82f6;
        }
